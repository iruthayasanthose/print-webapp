<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print QR Image</title>
  <script>
    async function fetchAsBase64(url) {
      const response = await fetch(url);
      const blob = await response.blob();
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]); // get base64 part only
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    window.onload = async function() {
      const params = new URLSearchParams(window.location.search);
      const qrUrl = params.get("qr");

      if (!qrUrl) {
        document.body.innerHTML = "❌ Missing QR code URL";
        return;
      }

      document.body.innerHTML = "<h3>⏳ Preparing to print...</h3>";

      try {
        // Fetch image and convert to base64
        const base64Image = await fetchAsBase64(qrUrl);
        // Construct rawbt URL
        const rawbtUrl = "rawbt:image," + base64Image;
        // Wait a moment before redirecting
        setTimeout(() => {
          window.location.href = rawbtUrl;
        }, 1000);
      } catch (err) {
        document.body.innerHTML = "⚠️ Failed to load image: " + err.message;
      }
    };
  </script>
</head>
<body>
  <h3>Printing QR...</h3>
</body>
</html>
