<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print QR Label</title>
  <style>
    body {
      width: 50mm;
      height: 29mm;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    img {
      width: 26mm;
      height: 26mm;
      object-fit: contain;
      margin-bottom: 1mm;
    }
    .label-text {
      font-size: 8pt;
      text-align: center;
      max-width: 48mm;
      line-height: 1.1;
      overflow: hidden;
      white-space: nowrap;
    }
    button {
      margin-top: 4mm;
      background: #2c7be5;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 10pt;
      cursor: pointer;
    }
  </style>
  <script>
    async function printImage(url) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const reader = new FileReader();
        reader.onloadend = function () {
          const base64Data = reader.result.split(',')[1];
          const rawbtUrl =
            'intent:#Intent;' +
            'action=ru.a402d.rawbtprinter.action.PRINT;' +
            'type=image/png;' +
            'S.image=' + base64Data + ';' +
            'end;';
          window.location.href = rawbtUrl;
        };
        reader.readAsDataURL(blob);
      } catch (e) {
        alert('⚠️ Print failed: ' + e.message);
      }
    }

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const qrUrl = params.get('qr');
      const label = params.get('label') || '';

      if (!qrUrl) {
        document.body.innerHTML = '❌ Missing QR code URL';
        return;
      }

      document.body.innerHTML = `
        <img id="qrimg" src="${qrUrl}" />
        <div class="label-text">${label}</div>
        <button onclick="printImage('${qrUrl}')">🖨 Print Label</button>
      `;
    };
  </script>
</head>
<body>
  <h3>Loading label...</h3>
</body>
</html>
