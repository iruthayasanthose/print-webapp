<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Label</title>
  <style>
    body {
      width: 50mm;
      height: 30mm;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 10px;
      text-align: center;
      overflow: hidden;
    }
    img {
      width: 20mm;
      height: 20mm;
      object-fit: contain;
      margin-bottom: 2mm;
    }
    .text {
      line-height: 1.1;
    }
  </style>
</head>
<body>
  <div id="label"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const job = params.get("job") || "";
    const customer = params.get("customer") || "";
    const model = params.get("model") || "";

    const qrData = `JOB:${job}, MODEL:${model}`;
    const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(qrData)}&size=200`;

    document.getElementById("label").innerHTML = `
      <img src="${qrUrl}" />
      <div class="text">
        <b>${job}</b><br>
        ${customer}<br>
        ${model}
      </div>
    `;

    // auto print via RawBT
    setTimeout(() => {
      const rawbtUrl = "rawbt:image," + encodeURIComponent(qrUrl);
      window.location.href = rawbtUrl;
    }, 1000);
  </script>
</body>
</html>
