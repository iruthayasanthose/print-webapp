<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print QR Label</title>
  <style>
    body {
      width: 50mm;
      height: 30mm;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: white;
    }
    img {
      width: 25mm;
      height: 25mm;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="qr" alt="QR" />
  <script>
    const params = new URLSearchParams(window.location.search);
    const qr = params.get("qr");
    if (qr) {
      document.getElementById("qr").src = qr;
      // Wait 1 sec to ensure image loads
      setTimeout(() => {
        const rawbtUrl = "rawbt:image," + encodeURIComponent(qr);
        window.location.href = rawbtUrl;
      }, 1000);
    } else {
      document.body.innerHTML = "<p>No QR found</p>";
    }
  </script>
</body>
</html>
